[versions]
agp = "9.3.3"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.5.1"
appcompat = "1.7.1"
material = "1.14.0"
activityKtx = "1.13.0"
constraintlayout = "2.2.2"
hilt = "2.60.1"
ksp = "2.3.10"
viewpager = "1.1.0"
viewpager2 = "1.1.0"
recyclerview = "1.4.0"
rxPreferences = "2.0.1"
rxKotlin = "2.4.0"
timber = "5.0.1"
paging = "3.3.6"
sdpSsp = "1.1.1"
autodispose = "1.4.0"
lifecycle = "2.9.4"
window = "1.4.0"
camerax = "1.5.3"
lottie = "6.7.1"
coil = "2.7.0"
retrofit = "3.0.0"
kotlinCoroutines = "1.10.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-viewpager = { module = "androidx.viewpager:viewpager", version.ref = "viewpager" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
recycler-view = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
rx-pref = { module = "com.f2prateek.rx.preferences2:rx-preferences", version.ref = "rxPreferences" }
rx-kotlin = { module = "io.reactivex.rxjava2:rxkotlin", version.ref = "rxKotlin" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
paging = { module = "androidx.paging:paging-runtime-ktx", version.ref = "paging" }
sdp = { module = "com.intuit.sdp:sdp-android", version.ref = "sdpSsp" }
ssp = { module = "com.intuit.ssp:ssp-android", version.ref = "sdpSsp" }
uber-autodispose = { module = "com.uber.autodispose:autodispose", version.ref = "autodispose" }
uber-autodispose-android = { module = "com.uber.autodispose:autodispose-android", version.ref = "autodispose" }
uber-autodispose-android-archcomponents = { module = "com.uber.autodispose:autodispose-android-archcomponents", version.ref = "autodispose" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-android-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
window = { module = "androidx.window:window", version.ref = "window" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
kotlin-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinCoroutines" }
camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
coil = { module = "io.coil-kt:coil", version.ref = "coil" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }

[bundles]
sdp-ssp-libs = ["sdp", "ssp"]
camera-libs = ["camera-core", "camera-camera2", "camera-lifecycle", "camera-view"]
retrofit-libs = ["retrofit", "retrofit-converter-gson"]
uber-autodispose-libs = ["uber-autodispose", "uber-autodispose-android", "uber-autodispose-android-archcomponents"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

